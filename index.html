<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#8fd8ff" />
  <title>Balloon Colours</title>
  <meta name="description" content="A calm colour-learning balloon game for toddlers." />
  <style>
:root { font-family: ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif; color: #17324d; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; touch-action: manipulation; }
body { background: #8fd8ff; }
button, select, input { font: inherit; }
.screen { display: none; width: 100%; height: 100%; position: relative; }
.screen.active { display: flex; }
#startScreen { align-items: center; justify-content: center; flex-direction: column; gap: 12px; background: linear-gradient(#8fd8ff 0 70%, #8fe18c 70%); text-align: center; padding: 24px; }
h1 { margin: 0; font-size: clamp(2.2rem, 8vw, 5rem); color: white; text-shadow: 0 5px 0 rgba(31,96,142,.22); }
#startScreen p { margin: 0 0 18px; font-size: clamp(1.15rem, 4vw, 1.8rem); font-weight: 800; }
.title-balloon { font-size: clamp(5rem, 18vw, 10rem); animation: bob 2.3s ease-in-out infinite; filter: drop-shadow(0 8px 3px rgba(0,0,0,.12)); }
.big-button { border: 0; border-radius: 999px; min-width: 220px; padding: 22px 42px; font-size: clamp(1.6rem, 5vw, 2.3rem); font-weight: 900; background: #ffe45c; color: #523d00; box-shadow: 0 9px 0 #d5af16; cursor: pointer; }
.big-button:active { transform: translateY(5px); box-shadow: 0 4px 0 #d5af16; }
.big-button.small { font-size: 1.25rem; padding: 14px 28px; min-width: 150px; }
.parent-button { margin-top: 20px; border: 0; border-radius: 20px; padding: 12px 18px; background: rgba(255,255,255,.55); color: #26445d; font-size: .95rem; font-weight: 800; }
.cloud { position: absolute; width: 130px; height: 42px; border-radius: 999px; background: rgba(255,255,255,.9); }
.cloud::before, .cloud::after { content:""; position:absolute; background:inherit; border-radius:50%; }
.cloud::before { width: 58px; height: 58px; left: 18px; top: -28px; }
.cloud::after { width: 72px; height: 72px; right: 14px; top: -38px; }
.cloud-a { top: 14%; left: 8%; transform: scale(.8); }
.cloud-b { top: 25%; right: 5%; transform: scale(1.05); }
#gameScreen { background: #8fd8ff; }
#sky { position: relative; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(#79d2ff 0%, #c5efff 78%, #a8e796 78%); }
.sun { position:absolute; top: 4vh; right: 5vw; width: clamp(70px,13vw,115px); aspect-ratio:1; border-radius:50%; background:#ffe869; display:grid; place-items:center; font-size:clamp(1.2rem,3vw,2rem); box-shadow:0 0 0 12px rgba(255,232,105,.22); }
.drifting { opacity:.8; animation: drift 18s linear infinite; }
.drifting.one { top: 16%; left: -180px; }
.drifting.two { top: 34%; left: -220px; transform:scale(.7); animation-delay:-9s; animation-duration:24s; }
#balloonLayer, #confettiLayer { position:absolute; inset:0; pointer-events:none; }
.balloon { --size: 105px; position:absolute; width:var(--size); height:calc(var(--size) * 1.22); border:0; padding:0; border-radius:50% 50% 46% 46%; cursor:pointer; pointer-events:auto; box-shadow: inset -12px -14px 0 rgba(0,0,0,.10), inset 15px 13px 0 rgba(255,255,255,.22), 0 8px 9px rgba(0,0,0,.12); animation: floatUp var(--duration) linear forwards, wiggle 2.2s ease-in-out infinite; transform-origin:center bottom; }
.balloon::before { content:""; position:absolute; width:0; height:0; border-left:10px solid transparent; border-right:10px solid transparent; border-top:17px solid currentColor; bottom:-12px; left:calc(50% - 10px); filter:brightness(.8); }
.balloon::after { content:""; position:absolute; width:2px; height:90px; background:rgba(80,80,80,.35); top:calc(100% + 13px); left:50%; }
.balloon:focus-visible { outline: 8px solid white; outline-offset: 5px; }
.pop { animation: pop .17s ease-out forwards !important; }
.confetti { position:absolute; width:12px; height:18px; border-radius:3px; animation: confetti .9s ease-out forwards; }
#colourWord { position:absolute; left:50%; top:48%; transform:translate(-50%,-50%) scale(.75); color:#fff; font-size:clamp(2.4rem,11vw,7rem); font-weight:1000; text-shadow:0 6px 0 rgba(0,0,0,.18); opacity:0; pointer-events:none; }
#colourWord.show { animation: word 1.1s ease-out; }
#reward { position:absolute; left:50%; top:28%; transform:translate(-50%,-50%) scale(0); font-size:clamp(7rem,28vw,17rem); opacity:0; }
#reward.show { animation: reward 2.4s ease-in-out; }
.corner-button { position:absolute; z-index:20; left:18px; top:max(18px, env(safe-area-inset-top)); width:58px; height:58px; border:0; border-radius:50%; background:rgba(255,255,255,.78); color:#2e5672; font-size:2rem; font-weight:900; box-shadow:0 4px 0 rgba(45,100,135,.2); }
.corner-button.right { left:auto; right:18px; top:auto; bottom:max(18px, env(safe-area-inset-bottom)); font-size:1.55rem; }
.panel-screen { align-items:center; justify-content:center; background:linear-gradient(#8fd8ff,#d8f6ff); padding:20px; }
.settings-card { width:min(560px,94vw); background:white; border-radius:32px; padding:clamp(22px,5vw,42px); box-shadow:0 18px 45px rgba(36,96,132,.2); }
.settings-card h2 { margin-top:0; font-size:clamp(1.7rem,5vw,2.6rem); }
.settings-card label { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:16px 0; border-bottom:2px solid #e8f5fb; font-size:1.1rem; font-weight:800; }
.settings-card input { width:28px; height:28px; }
.settings-card select { max-width:62%; padding:10px; border-radius:12px; border:2px solid #cceaf6; }
.note { line-height:1.45; color:#526d7e; }
@keyframes bob { 50% { transform:translateY(-15px) rotate(3deg); } }
@keyframes drift { to { left:calc(100% + 220px); } }
@keyframes floatUp { from { top:110%; } to { top:-190px; } }
@keyframes wiggle { 0%,100% { margin-left:-4px; } 50% { margin-left:8px; } }
@keyframes pop { 55% { transform:scale(1.25); opacity:1; } 100% { transform:scale(.05); opacity:0; } }
@keyframes confetti { to { transform:translate(var(--x),var(--y)) rotate(var(--r)); opacity:0; } }
@keyframes word { 0% { opacity:0; transform:translate(-50%,-50%) scale(.75); } 18%,68% { opacity:1; transform:translate(-50%,-50%) scale(1); } 100% { opacity:0; transform:translate(-50%,-60%) scale(1.05); } }
@keyframes reward { 0% { opacity:0; transform:translate(-50%,-50%) scale(.2); } 25%,70% { opacity:1; transform:translate(-50%,-50%) scale(1); } 100% { opacity:0; transform:translate(-50%,-55%) scale(1.15); } }
@media (prefers-reduced-motion: reduce) { .drifting, .title-balloon { animation-duration: 8s; } }

</style>
</head>
<body>
  <main id="app" aria-label="Balloon Colours toddler game">
    <section id="startScreen" class="screen active">
      <div class="cloud cloud-a"></div><div class="cloud cloud-b"></div>
      <div class="title-balloon" aria-hidden="true">🎈</div>
      <h1>Balloon Colours</h1>
      <p>Tap, pop, and learn!</p>
      <button id="playButton" class="big-button" type="button" aria-label="Play Balloon Colours">Play</button>
      <button id="parentButton" class="parent-button" type="button" aria-label="Hold for parent settings">⚙ Hold for grown-ups</button>
    </section>

    <section id="gameScreen" class="screen" aria-live="polite">
      <div id="sky" aria-label="Tap the floating balloons">
        <div class="sun" aria-hidden="true"><span>•‿•</span></div>
        <div class="cloud drifting one"></div>
        <div class="cloud drifting two"></div>
        <div id="balloonLayer"></div>
        <div id="confettiLayer" aria-hidden="true"></div>
        <div id="reward" aria-hidden="true">🌈</div>
        <div id="colourWord" role="status"></div>
        <button id="homeButton" class="corner-button" type="button" aria-label="Go to home screen">⌂</button>
        <button id="soundButton" class="corner-button right" type="button" aria-label="Turn sound off">🔊</button>
      </div>
    </section>

    <section id="parentScreen" class="screen panel-screen">
      <div class="settings-card">
        <h2>Grown-up settings</h2>
        <label><span>Music</span><input id="musicToggle" type="checkbox" checked /></label>
        <label><span>Voice</span><input id="voiceToggle" type="checkbox" checked /></label>
        <label><span>Sound effects</span><input id="effectsToggle" type="checkbox" checked /></label>
        <label><span>Colours</span>
          <select id="colourSet">
            <option value="starter">Starter: red, blue, green, yellow</option>
            <option value="all">All colours</option>
          </select>
        </label>
        <p class="note">The game has no scores, adverts, timers, or wrong answers.</p>
        <button id="doneButton" class="big-button small" type="button">Done</button>
      </div>
    </section>
  </main>

  <script>
(() => {
  'use strict';

  const colourSets = {
    starter: [
      { name: 'Red', hex: '#ef4444' },
      { name: 'Blue', hex: '#3b82f6' },
      { name: 'Green', hex: '#39b95f' },
      { name: 'Yellow', hex: '#f6cf32' }
    ],
    all: [
      { name: 'Red', hex: '#ef4444' }, { name: 'Blue', hex: '#3b82f6' },
      { name: 'Green', hex: '#39b95f' }, { name: 'Yellow', hex: '#f6cf32' },
      { name: 'Orange', hex: '#f58a31' }, { name: 'Purple', hex: '#9b5de5' },
      { name: 'Pink', hex: '#f472b6' }, { name: 'White', hex: '#f8fafc' },
      { name: 'Brown', hex: '#925f3d' }, { name: 'Black', hex: '#252733' }
    ]
  };

  const screens = [...document.querySelectorAll('.screen')];
  const balloonLayer = document.getElementById('balloonLayer');
  const confettiLayer = document.getElementById('confettiLayer');
  const colourWord = document.getElementById('colourWord');
  const reward = document.getElementById('reward');
  const popAudio = document.getElementById('popAudio');
  const magicAudio = document.getElementById('magicAudio');
  const musicAudio = document.getElementById('musicAudio');
  const soundButton = document.getElementById('soundButton');

  const settings = { music: true, voice: true, effects: true, colourSet: 'starter', muted: false };
  let spawnTimer = null;
  let popped = 0;
  let parentHold = null;

  musicAudio.volume = 0.16;
  popAudio.volume = 0.7;
  magicAudio.volume = 0.38;

  function showScreen(id) {
    screens.forEach(screen => screen.classList.toggle('active', screen.id === id));
  }

  function playClone(audio) {
    if (!settings.effects || settings.muted) return;
    const clone = audio.cloneNode(true);
    clone.volume = audio.volume;
    clone.play().catch(() => {});
  }

  function startMusic() {
    if (settings.music && !settings.muted) musicAudio.play().catch(() => {});
  }

  function stopMusic() { musicAudio.pause(); }

  function speak(text) {
    if (!settings.voice || settings.muted || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 0.72;
    utterance.pitch = 1.12;
    utterance.volume = 0.92;
    const voices = speechSynthesis.getVoices();
    const preferred = voices.find(v => /female|samantha|serena|karen|victoria|zira|google uk english female/i.test(v.name))
      || voices.find(v => /^en(-|_)/i.test(v.lang));
    if (preferred) utterance.voice = preferred;
    const previousVolume = musicAudio.volume;
    musicAudio.volume = 0.05;
    utterance.onend = () => { musicAudio.volume = previousVolume; };
    speechSynthesis.speak(utterance);
  }

  function randomColour() {
    const colours = colourSets[settings.colourSet];
    return colours[Math.floor(Math.random() * colours.length)];
  }

  function spawnBalloon() {
    if (!document.getElementById('gameScreen').classList.contains('active')) return;
    if (balloonLayer.children.length >= 5) return;

    const colour = randomColour();
    const balloon = document.createElement('button');
    balloon.type = 'button';
    balloon.className = 'balloon';
    balloon.setAttribute('aria-label', `${colour.name} balloon`);
    balloon.style.background = colour.hex;
    balloon.style.color = colour.hex;
    balloon.style.left = `${6 + Math.random() * 78}%`;
    balloon.style.setProperty('--size', `${82 + Math.random() * 52}px`);
    balloon.style.setProperty('--duration', `${8.5 + Math.random() * 5}s`);
    balloon.addEventListener('pointerdown', event => popBalloon(event, balloon, colour), { once: true });
    balloon.addEventListener('animationend', event => {
      if (event.animationName === 'floatUp') balloon.remove();
    });
    balloonLayer.appendChild(balloon);
  }

  function popBalloon(event, balloon, colour) {
    event.preventDefault();
    if (balloon.classList.contains('pop')) return;
    balloon.classList.add('pop');
    balloon.style.pointerEvents = 'none';
    playClone(popAudio);
    burstConfetti(balloon, colour.hex);
    showWord(colour.name);
    setTimeout(() => speak(colour.name), 260);
    popped += 1;
    if (popped % 10 === 0) setTimeout(showReward, 650);
    setTimeout(() => balloon.remove(), 220);
    setTimeout(spawnBalloon, 520);
  }

  function burstConfetti(balloon, mainColour) {
    const rect = balloon.getBoundingClientRect();
    const colours = [mainColour, '#ffe45c', '#ffffff', '#ff8fab', '#8b5cf6'];
    for (let i = 0; i < 28; i += 1) {
      const piece = document.createElement('i');
      piece.className = 'confetti';
      piece.style.left = `${rect.left + rect.width / 2}px`;
      piece.style.top = `${rect.top + rect.height / 2}px`;
      piece.style.background = colours[i % colours.length];
      const angle = Math.random() * Math.PI * 2;
      const distance = 55 + Math.random() * 125;
      piece.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
      piece.style.setProperty('--y', `${Math.sin(angle) * distance + 65}px`);
      piece.style.setProperty('--r', `${Math.random() * 720 - 360}deg`);
      confettiLayer.appendChild(piece);
      setTimeout(() => piece.remove(), 950);
    }
  }

  function showWord(name) {
    colourWord.textContent = name;
    colourWord.classList.remove('show');
    void colourWord.offsetWidth;
    colourWord.classList.add('show');
  }

  function showReward() {
    playClone(magicAudio);
    reward.classList.remove('show');
    void reward.offsetWidth;
    reward.classList.add('show');
    speak('Wonderful!');
  }

  function startGame() {
    popped = 0;
    balloonLayer.replaceChildren();
    showScreen('gameScreen');
    startMusic();
    for (let i = 0; i < 4; i += 1) setTimeout(spawnBalloon, i * 620);
    clearInterval(spawnTimer);
    spawnTimer = setInterval(spawnBalloon, 1700);
  }

  function goHome() {
    clearInterval(spawnTimer);
    balloonLayer.replaceChildren();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    stopMusic();
    showScreen('startScreen');
  }

  document.getElementById('playButton').addEventListener('click', startGame);
  document.getElementById('homeButton').addEventListener('click', goHome);
  document.getElementById('doneButton').addEventListener('click', () => showScreen('startScreen'));

  soundButton.addEventListener('click', () => {
    settings.muted = !settings.muted;
    soundButton.textContent = settings.muted ? '🔇' : '🔊';
    soundButton.setAttribute('aria-label', settings.muted ? 'Turn sound on' : 'Turn sound off');
    if (settings.muted) { stopMusic(); if ('speechSynthesis' in window) speechSynthesis.cancel(); }
    else startMusic();
  });

  document.getElementById('musicToggle').addEventListener('change', e => { settings.music = e.target.checked; });
  document.getElementById('voiceToggle').addEventListener('change', e => { settings.voice = e.target.checked; });
  document.getElementById('effectsToggle').addEventListener('change', e => { settings.effects = e.target.checked; });
  document.getElementById('colourSet').addEventListener('change', e => { settings.colourSet = e.target.value; });

  const parentButton = document.getElementById('parentButton');
  const beginHold = event => {
    event.preventDefault();
    parentButton.textContent = 'Keep holding…';
    parentHold = setTimeout(() => {
      parentButton.textContent = '⚙ Hold for grown-ups';
      showScreen('parentScreen');
    }, 1800);
  };
  const cancelHold = () => {
    clearTimeout(parentHold);
    parentButton.textContent = '⚙ Hold for grown-ups';
  };
  parentButton.addEventListener('pointerdown', beginHold);
  parentButton.addEventListener('pointerup', cancelHold);
  parentButton.addEventListener('pointerleave', cancelHold);
  parentButton.addEventListener('pointercancel', cancelHold);

  window.addEventListener('contextmenu', event => event.preventDefault());
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
})();

</script>
